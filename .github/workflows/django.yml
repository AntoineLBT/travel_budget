name: Django CI

on:
  push:
    branches: [ "master","develop","test"]
  pull_request:
    branches: [ "master","develop","test"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: travel_budget_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with Flake8
      run: |
        flake8 . --max-line-length 88 --exclude .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg,accounts/migrations/0001_initial.py,htmlcov/,settings.py
    - name: Sort with Isort
      run: |
        isort .
    - name: Run Tests
      run: |
        coverage run --omit="manage.py","travel_budget/*" --source='.' manage.py test
        coverage report --fail-under=100

  deploy:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (not needed for remote clone but useful for other tasks)
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Clone repo & build with Docker on remote
        run: |
          ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            set -e
            rm -rf travel_budget_2 || true
            git clone https://github.com/${{ github.repository }} travel_budget_2
            cd travel_budget_2
            git checkout test
            echo POSTGRES_DB=travel_budget_db > .env
            echo POSTGRES_USER=admin >> .env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
            echo DB_HOST=db >> .env
            echo DB_PORT=5432 >> .env
            echo VOLUME_PATH=../data/postgresql
            docker compose build
            docker compose down
            docker compose up -d
            docker system prune -f
          EOF